<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Vergleich – Müll AI</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>🗑️ AI Müllvergleich</h1>

      <div class="upload">
        <input type="file" id="fileInput" accept="image/*" />
        <br />
        <button onclick="send()">Analysieren</button>

        <br />
        <img id="preview" />

        <div class="spinner" id="spinner"></div>
      </div>

      <div class="item" id="item"></div>

      <div class="grid" id="results"></div>
    </div>

    <script>
      const input = document.getElementById("fileInput");
      const preview = document.getElementById("preview");
      const spinner = document.getElementById("spinner");
      const resultsDiv = document.getElementById("results");
      const itemDiv = document.getElementById("item");

      input.addEventListener("change", () => {
        const file = input.files[0];
        if (file) {
          preview.src = URL.createObjectURL(file);
        }
      });

      function createCard(model, data) {
        const card = document.createElement("div");
        card.className = "card";

        if (!data || data.error) {
          card.innerHTML = `
            <h3>${model}</h3>
            <div class="error">❌ Kein gültiges JSON</div>
          `;
          return card;
        }

        card.innerHTML = `
          <h3>${model}</h3>

          <div class="field">
            <span class="label">Müllart:</span>
            <span class="value">${data.müllart || "-"}</span>
          </div>

          <div class="field">
            <span class="label">Behälter:</span>
            <span class="value">${data.behälter || "-"}</span>
          </div>

          <div class="field">
            <span class="label">Sicherheit:</span>
            <span class="value">${data.sicherheit || "-"}</span>
          </div>
        `;

        return card;
      }

      window.send = async function () {
        const file = input.files[0];

        if (!file) {
          alert("Bitte Bild auswählen");
          return;
        }

        resultsDiv.innerHTML = "";
        itemDiv.textContent = "";
        spinner.style.display = "block";

        const formData = new FormData();
        formData.append("image", file);

        try {
          // 👉 startet Job (KEIN Ergebnis mehr direkt!)
          const res = await fetch(`${window.location.origin}/analyze`, {
            method: "POST",
            body: formData,
          });

          const { jobId } = await res.json();

          pollStatus(jobId);
        } catch (err) {
          spinner.style.display = "none";
          itemDiv.textContent = "Fehler beim Starten";
        }
      };

      async function pollStatus(jobId) {
        const interval = setInterval(async () => {
          try {
            const res = await fetch(
              `${window.location.origin}/status/${jobId}`,
            );
            const data = await res.json();

            // 👉 Status anzeigen (Queue + Step)
            itemDiv.innerHTML = `
              <strong>${data.step}</strong>
              ${data.position ? `<br>Warteschlange: ${data.position}` : ""}
            `;

            if (data.status === "done") {
              clearInterval(interval);
              spinner.style.display = "none";

              const result = data.result;

              // 👉 Ergebnis wie vorher anzeigen
              itemDiv.innerHTML = `<strong>Erkannt:</strong> ${result.NameItem}`;

              Object.entries(result).forEach(([key, value]) => {
                if (key === "NameItem") return;
                resultsDiv.appendChild(createCard(key, value));
              });
            }

            if (data.status === "error") {
              clearInterval(interval);
              spinner.style.display = "none";
              itemDiv.textContent = "Fehler!";
            }
          } catch (err) {
            clearInterval(interval);
            spinner.style.display = "none";
            itemDiv.textContent = "Verbindungsfehler";
          }
        }, 1000);
      }
    </script>
  </body>
</html>
