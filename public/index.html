<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Vergleich – Müll AI</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>🗑️ AI Müllvergleich</h1>

      <div class="upload">
        <input type="file" id="fileInput" accept="image/*" />
        <br />
        <button onclick="send()">Analysieren</button>

        <br />
        <img id="preview" />

        <div class="spinner" id="spinner"></div>
      </div>

      <div class="item" id="item"></div>

      <div class="grid" id="results"></div>

    </div>

    <script>
      const input = document.getElementById("fileInput");
      const preview = document.getElementById("preview");
      const spinner = document.getElementById("spinner");
      const resultsDiv = document.getElementById("results");
      const itemDiv = document.getElementById("item");
      let currentResult = null;

      input.addEventListener("change", () => {
        const file = input.files[0];
        if (file) {
          preview.src = URL.createObjectURL(file);
        }
      });

      function createCard(model, data) {
        const card = document.createElement("div");
        card.className = "card";

        if (!data || data.error) {
          card.innerHTML = `
            <h3>${model}</h3>
            <div class="error">❌ Kein gültiges JSON</div>
          `;
          return card;
        }

        card.innerHTML = `
          <h3>${model}</h3>

          <div class="field">
            <span class="label">Müllart:</span>
            <span class="value">${data.müllart || "-"}</span>
          </div>

          <div class="field">
            <span class="label">Behälter:</span>
            <span class="value">${data.behälter || "-"}</span>
          </div>

          <div class="field">
            <span class="label">Sicherheit:</span>
            <span class="value">${data.sicherheit || "-"}</span>
          </div>

          <div class="vote-buttons">
            <button onclick="sendModelFeedback('${model}', 'yes')">Correct</button>
            <button onclick="sendModelFeedback('${model}', 'no')">Wrong</button>
            <button onclick="sendModelFeedback('${model}', 'dont_know')">Don't know</button>
          </div>
        `;

        return card;
      }

      window.send = async function () {
        const file = input.files[0];

        if (!file) {
          alert("Bitte Bild auswählen");
          return;
        }
          currentResult = null;

        resultsDiv.innerHTML = "";
        itemDiv.textContent = "";
        spinner.style.display = "block";

        const formData = new FormData();
        formData.append("image", file);

        try {
          // startet Job (KEIN Ergebnis mehr direkt!)
          const res = await fetch(`${window.location.origin}/analyze`, {
            method: "POST",
            body: formData,
          });

          const { jobId } = await res.json();

          pollStatus(jobId);
        } catch (err) {
          spinner.style.display = "none";
          itemDiv.textContent = "Fehler beim Starten";
        }
      };

      async function pollStatus(jobId) {
        const interval = setInterval(async () => {
          try {
            const res = await fetch(
              `${window.location.origin}/status/${jobId}`,
            );
            const data = await res.json();

            // Status anzeigen (Queue + Step)
            itemDiv.innerHTML = `
              <strong>${data.step}</strong>
              ${data.position ? `${data.position}` : ""}
            `;

            if (data.status === "done") {
              clearInterval(interval);
              spinner.style.display = "none";

            const raw = data.result;

            currentResult = {
              name: raw.NameItem,
              models: Object.entries(raw)
                .filter(([key]) => key !== "NameItem")
                .map(([model, value]) => ({
                  model: model,
                  material: raw.NameItem,
                  bin: value.behälter,
                  safety: value.sicherheit
                }))
            };
              // Ergebnis wie vorher anzeigen
              itemDiv.innerHTML = `<strong>Erkannt:</strong> ${currentResult.name}`;


              currentResult.models.forEach((m) => {
                resultsDiv.appendChild(createCard(m.model, {
                  müllart: m.material,
                  behälter: m.bin,
                  sicherheit: m.safety
                }));
              });
            }

            if (data.status === "error") {
              clearInterval(interval);
              spinner.style.display = "none";
              itemDiv.textContent = "Fehler!";
            }
          } catch (err) {
            clearInterval(interval);
            spinner.style.display = "none";
            itemDiv.textContent = "Verbindungsfehler";
          }
        }, 1000);
      }
          async function sendModelFeedback(model, value) {
            if (!currentResult) return;

            const modelData = currentResult.models.find(m => m.model === model);

            await fetch("/feedback", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                model: model,
                material: currentResult.name,
                bin: modelData?.bin,
                safety: modelData?.safety,
                feedback: value
              }),
            });

            alert(`Feedback saved for ${model}`);
          }
    </script>
  </body>
</html>
