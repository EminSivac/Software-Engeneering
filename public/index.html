<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>VLM Vergleich – Müll AI</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 1000px;
        margin-top: 40px;
      }

      h1 {
        text-align: center;
      }

      .upload {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      button {
        margin-top: 10px;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        cursor: pointer;
        font-size: 15px;
      }

      button:hover {
        background: #0056b3;
      }

      img {
        margin-top: 15px;
        max-width: 300px;
        border-radius: 8px;
      }

      .spinner {
        margin: 20px auto;
        width: 40px;
        height: 40px;
        border: 5px solid #ddd;
        border-top: 5px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        display: none;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      .item {
        margin-top: 20px;
        font-size: 18px;
        text-align: center;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 20px;
      }

      .card {
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      }

      .card h3 {
        margin-top: 0;
        font-size: 16px;
      }

      .field {
        margin-top: 8px;
      }

      .label {
        font-weight: bold;
        color: #555;
      }

      .value {
        margin-left: 5px;
      }

      .error {
        color: red;
        font-size: 13px;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🗑️ VLM Müllvergleich</h1>

      <div class="upload">
        <input type="file" id="fileInput" accept="image/*" />
        <br />
        <button onclick="send()">Analysieren</button>

        <br />
        <img id="preview" />

        <div class="spinner" id="spinner"></div>
      </div>

      <div class="item" id="item"></div>

      <div class="grid" id="results"></div>
    </div>

    <script>
      const input = document.getElementById("fileInput");
      const preview = document.getElementById("preview");
      const spinner = document.getElementById("spinner");
      const resultsDiv = document.getElementById("results");
      const itemDiv = document.getElementById("item");

      input.addEventListener("change", () => {
        const file = input.files[0];
        if (file) {
          preview.src = URL.createObjectURL(file);
        }
      });

      function createCard(model, data) {
        const card = document.createElement("div");
        card.className = "card";

        if (!data || data.error) {
          card.innerHTML = `
          <h3>${model}</h3>
          <div class="error">❌ Kein gültiges JSON</div>
        `;
          return card;
        }

        card.innerHTML = `
        <h3>${model}</h3>

        <div class="field">
          <span class="label">Müllart:</span>
          <span class="value">${data.müllart || "-"}</span>
        </div>

        <div class="field">
          <span class="label">Behälter:</span>
          <span class="value">${data.behälter || "-"}</span>
        </div>

        <div class="field">
          <span class="label">Sicherheit:</span>
          <span class="value">${data.sicherheit || "-"}</span>
        </div>
      `;

        return card;
      }

      window.send = async function () {
        const file = input.files[0];

        if (!file) {
          alert("Bitte Bild auswählen");
          return;
        }

        resultsDiv.innerHTML = "";
        itemDiv.textContent = "";
        spinner.style.display = "block";

        const formData = new FormData();
        formData.append("image", file);

        try {
          const res = await fetch(`${window.location.origin}/analyze`, {
            method: "POST",
            body: formData,
          });

          const data = await res.json();

          spinner.style.display = "none";

          // erkannter Gegenstand
          itemDiv.innerHTML = `<strong>Erkannt:</strong> ${data.NameItem || "-"}`;

          // Karten erstellen
          Object.entries(data).forEach(([key, value]) => {
            if (key === "NameItem") return;

            const card = createCard(key, value);
            resultsDiv.appendChild(card);
          });
        } catch (err) {
          spinner.style.display = "none";
          resultsDiv.innerHTML = `<div class="error">Fehler: ${err.message}</div>`;
        }
      };
    </script>
  </body>
</html>
